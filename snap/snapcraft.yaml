name: posting
base: core26
version: '2.11.2'
title: Posting
summary: Interactive terminal HTTP/API client with collections and environments
description: |
  Posting is an HTTP client that runs in your terminal. Requests are saved
  as YAML files in collections, and environments hold your variables.

  **Examples**

     posting --collection ~/my-api
     posting --collection ~/my-api --env ~/my-api/dev.env
     posting import ./openapi.yaml --output ~/my-api

  **File access**

  Posting can use collections in your home directory. To also use USB drives
  and other removable media (/media, /mnt), run:

     sudo snap connect posting:removable-media
license: Apache-2.0
grade: stable
confinement: strict
website: https://github.com/darrenburns/posting
source-code:
  - https://github.com/darrenburns/posting
  - https://github.com/sidalit/posting-snap
issues:
  - https://github.com/darrenburns/posting/issues
  - https://github.com/sidalit/posting-snap/issues
contact: https://github.com/sidalit/posting-snap/issues

platforms:
  amd64:
  arm64:

apps:
  posting:
    command: bin/posting
    completer: share/bash-completion/completions/posting
    plugs:
      - home
      - network
      - removable-media

parts:
  posting:
    plugin: uv
    source: https://github.com/darrenburns/posting.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    build-snaps:
      - astral-uv
    build-packages:
      - build-essential
      - cargo
      - rustc
      - pkg-config
    build-environment:
      # The locked pydantic 2.11 does not support Ubuntu 26.04's Python 3.14.
      # Bundle a standalone CPython 3.12 in usr/ instead.
      - PATH: $CRAFT_PART_INSTALL/bin:$CRAFT_PART_INSTALL/usr/bin:$PATH
      - PARTS_PYTHON_INTERPRETER: python3.12
    override-build: |
      UV_PYTHON_DOWNLOADS=manual UV_PYTHON_PREFERENCE=only-managed \
        uv python install --no-bin --install-dir "$CRAFT_PART_BUILD/python" 3.12
      python_dir=$(find "$CRAFT_PART_BUILD/python" -mindepth 1 -maxdepth 1 -type d -name 'cpython-3.12*' -print -quit)
      mkdir -p "$CRAFT_PART_INSTALL/usr"
      cp -a "$python_dir/." "$CRAFT_PART_INSTALL/usr/"
      craftctl default
      ln -sf python3.12 "$CRAFT_PART_INSTALL/bin/python"
      mkdir -p "$CRAFT_PART_INSTALL/share/bash-completion/completions"
      _POSTING_COMPLETE=bash_source "$CRAFT_PART_INSTALL/bin/posting" \
        > "$CRAFT_PART_INSTALL/share/bash-completion/completions/posting"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/posting/LICENSE"
    prime:
      - -usr/bin/2to3*
      - -usr/bin/idle3*
      - -usr/bin/pip*
      - -usr/bin/pydoc3*
      - -usr/bin/python3*-config
      - -usr/include
      - -usr/lib/libpython3*.so*
      - -usr/share
      - -usr/lib/pkgconfig
      - -usr/lib/python3.12/ensurepip
      - -usr/lib/python3.12/site-packages
      - -usr/lib/python3.12/idlelib
      - -usr/lib/python3.12/test
      - -usr/lib/python3.12/tkinter
      - -usr/lib/python3.12/turtledemo
      - -usr/lib/python3.12/lib-dynload/_tkinter*
      - -usr/lib/itcl*
      - -usr/lib/tcl*
      - -usr/lib/tk*
      - -usr/lib/thread*
